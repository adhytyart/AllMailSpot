{% raw %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Envelope: email head generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #151922;
  --bg-2: #1a1f2b;
  --surface: #1f2533;
  --surface-2: #272e3f;
  --line: #333c52;
  --line-soft: #283044;
  --text: #e7e9ef;
  --muted: #929bb0;
  --faint: #6b7489;
  --blue: #7fa6f5;
  --red: #ee7262;
  --paper: #f3eee2;
  --ok: #74c99a;
  --warn: #e9bf5c;
  --err: #f07a7a;
  --code-bg: #121620;
  --t-tag: #7fa6f5;
  --t-attr: #c3a7f5;
  --t-str: #a9d28d;
  --t-com: #69728a;
  --t-cc: #f0a868;
  --t-sel: #e6c17d;
  --t-prop: #7fd1c6;
  --t-val: #dfe3ec;
  --t-at: #ee7262;
  --sans: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --r-s: 6px;
  --r-m: 10px;
  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #151922; --surface: #1f2533; --text: #e7e9ef; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #151922; --surface: #1f2533; --text: #e7e9ef; color-scheme: dark; }
:root[data-ui="light"] {
  --bg: #eef0f4; --bg-2: #e6e9ef; --surface: #ffffff; --surface-2: #f2f4f8; --line: #cfd5e0; --line-soft: #e1e5ec;
  --text: #1c2230; --muted: #5a6478; --faint: #8a93a6; --blue: #2f62c9; --red: #c94a3a; --ok: #23824f; --warn: #9a6b00; --err: #c43c3c;
  --code-bg: #f7f8fb; --t-tag: #2f62c9; --t-attr: #7a46c4; --t-str: #2f7d2a; --t-com: #8a93a6; --t-cc: #b35c00; --t-sel: #8a5a00; --t-prop: #0f7c73; --t-val: #1c2230; --t-at: #c94a3a;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100dvh - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 4px; padding: 22px 14px 18px; border-right: 1px solid var(--line-soft); background: var(--bg-2); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; }
.brand-mark { width: 30px; height: 22px; border-radius: 3px; background: var(--paper); position: relative; overflow: hidden; flex: none; }
.brand-mark::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, var(--red) 0 5px, var(--paper) 5px 9px, var(--blue) 9px 14px, var(--paper) 14px 18px); }
.brand-mark::after { content: ""; position: absolute; inset: 4px; background: var(--paper); border-radius: 1px; }
.brand b { display: block; font-size: 16px; letter-spacing: -0.01em; }
.brand small { display: block; color: var(--muted); font-size: 12px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: var(--r-s); color: var(--muted); text-decoration: none; font-weight: 500; }
.nav a:hover { color: var(--text); background: var(--surface); }
.nav a[aria-current="page"] { color: var(--text); background: var(--surface-2); box-shadow: inset 2px 0 0 var(--blue); }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .count { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line-soft); font-size: 12px; color: var(--faint); }
.side-foot .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
.side-foot .dot.local { background: var(--warn); }
.side-foot .dot.memory { background: var(--err); }

main { min-width: 0; padding: 30px clamp(16px, 3.4vw, 44px) 60px; }
.view { max-width: 1320px; margin: 0 auto; }
.view-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 24px; }
.view-head h1 { margin: 0; font-size: 26px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 600; }
.view-head p { margin: 6px 0 0; color: var(--muted); max-width: 64ch; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 14px; white-space: nowrap; text-decoration: none; color: var(--text); }
.btn:hover:not(:disabled) { border-color: var(--faint); background: var(--surface-2); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #0f1522; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: #93b5f8; border-color: #93b5f8; }
:root[data-ui="light"] .btn.primary { color: #fff; }
:root[data-ui="light"] .btn.primary:hover:not(:disabled) { background: #2754ad; }
.btn.danger { color: var(--err); }
.btn.danger.solid { background: var(--err); border-color: var(--err); color: #1a0d0d; font-weight: 600; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--text); background: var(--surface); border-color: transparent; }
.btn.icon { padding: 0; width: 34px; min-height: 34px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.input, .select { min-height: 36px; padding: 0 12px; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--code-bg); }
.input::placeholder { color: var(--faint); }
.select { padding-right: 8px; }
.field { display: grid; gap: 6px; }
.field label, .lbl { font-size: 13px; color: var(--muted); font-weight: 500; }
.hint { font-size: 13px; color: var(--faint); }
.panel { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-m); }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line-soft); }
.panel-h h2, .panel-h h3 { margin: 0; font-size: 15px; font-weight: 600; }
.panel-b { padding: 16px 18px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.pill.err { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, transparent); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.pill.blue { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 40%, transparent); }
.mono { font-family: var(--mono); font-size: 0.92em; }
.muted { color: var(--muted); }
.empty { padding: 44px 24px; text-align: center; color: var(--muted); }
.empty h3 { margin: 0 0 6px; color: var(--text); font-size: 17px; font-weight: 600; }
.empty p { margin: 0 auto 18px; max-width: 52ch; }

/* ---------- dashboard ---------- */
.meter { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line-soft); border-radius: var(--r-m); background: var(--surface); overflow: hidden; margin-bottom: 22px; }
.meter > div { padding: 18px 20px; border-left: 1px solid var(--line-soft); }
.meter > div:first-child { border-left: 0; }
.meter dt { font-size: 13px; color: var(--muted); }
.meter dd { margin: 6px 0 0; font: 500 28px/1.1 var(--mono); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.meter dd small { font-size: 14px; color: var(--faint); letter-spacing: 0; }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.dash-quick { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; padding: 22px; margin-bottom: 22px; }
.dash-quick p { margin: 0; color: var(--muted); max-width: 60ch; }
.dash-quick h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
.list { list-style: none; margin: 0; padding: 0; }
.list li + li { border-top: 1px solid var(--line-soft); }
.mini { display: flex; align-items: center; gap: 12px; padding: 11px 18px; width: 100%; text-align: left; background: none; border: 0; cursor: pointer; }
.mini:hover { background: var(--surface-2); }
.mini .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.mini .tm { color: var(--faint); font-size: 13px; white-space: nowrap; }
.coverage { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 14px; }
.cov { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
.cov i { width: 9px; height: 9px; border-radius: 2px; background: var(--line); flex: none; }
.cov.on { color: var(--text); }
.cov.on i { background: var(--ok); }

/* ---------- airmail generate button ---------- */
.airmail { position: relative; display: inline-flex; padding: 6px; border-radius: 12px; border: 0; cursor: pointer; background: repeating-linear-gradient(-45deg, var(--red) 0 12px, var(--paper) 12px 20px, var(--blue) 20px 32px, var(--paper) 32px 40px); background-size: 56.57px 56.57px; }
.airmail span { display: flex; align-items: center; gap: 12px; padding: 16px 30px; border-radius: 7px; background: var(--bg); color: var(--text); font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
.airmail svg { width: 22px; height: 22px; }
.airmail:hover span { background: var(--surface); }
.airmail:disabled { cursor: progress; }
.airmail.busy { animation: post 0.9s linear infinite; }
.airmail.small span { padding: 11px 20px; font-size: 15px; }
@keyframes post { to { background-position: 56.57px 0; } }
@media (prefers-reduced-motion: reduce) { .airmail.busy { animation: none; opacity: 0.7; } }

/* ---------- library ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.toolbar .search { flex: 1 1 260px; position: relative; }
.toolbar .search input { width: 100%; padding-left: 36px; }
.toolbar .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); }
.result-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); margin: 0 2px 10px; }
.rows { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line-soft); border-radius: var(--r-m); background: var(--surface); overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 16px; align-items: center; padding: 10px 12px 10px 18px; }
.row + .row { border-top: 1px solid var(--line-soft); }
.row:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.row-main { display: grid; gap: 2px; min-width: 0; text-align: left; background: none; border: 0; padding: 4px 0; cursor: pointer; }
.row-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-main:hover .row-name { color: var(--blue); }
.row-sub { display: flex; gap: 14px; font-size: 12.5px; color: var(--faint); flex-wrap: wrap; }
.ticks { display: grid; grid-template-columns: repeat(13, 7px); gap: 3px; }
.ticks i { height: 16px; border-radius: 2px; background: var(--line); }
.ticks i.on { background: color-mix(in srgb, var(--ok) 75%, var(--surface)); }
.row-actions { display: flex; gap: 2px; }
.pager { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 16px; font-size: 13px; color: var(--muted); }

/* ---------- editor ---------- */
.ed { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; font: 13px/1.62 var(--mono); min-height: 0; }
.ed:focus-within { border-color: color-mix(in srgb, var(--blue) 60%, var(--line)); }
.ed-gutter { position: relative; overflow: hidden; padding: 14px 10px 14px 14px; color: var(--faint); text-align: right; user-select: none; border-right: 1px solid var(--line-soft); min-width: 46px; }
.ed-gutter pre { margin: 0; font: inherit; }
.ed-gutter .bad { color: var(--err); font-weight: 600; }
.ed-body { position: relative; min-height: 0; }
.ed-body pre, .ed-body textarea { position: absolute; inset: 0; margin: 0; padding: 14px 16px; font: inherit; white-space: pre; tab-size: 2; -moz-tab-size: 2; border: 0; letter-spacing: 0; word-spacing: 0; }
.ed-body pre { overflow: hidden; pointer-events: none; color: var(--t-val); }
.ed-body textarea { overflow: auto; resize: none; outline: none; background: transparent; color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--text); }
.ed-body textarea::selection { background: color-mix(in srgb, var(--blue) 35%, transparent); -webkit-text-fill-color: transparent; }
.ed-body textarea::placeholder { -webkit-text-fill-color: var(--faint); color: var(--faint); }
.t-tag { color: var(--t-tag); } .t-attr { color: var(--t-attr); } .t-str { color: var(--t-str); }
.t-com { color: var(--t-com); font-style: italic; } .t-cc { color: var(--t-cc); font-weight: 500; }
.t-sel { color: var(--t-sel); } .t-prop { color: var(--t-prop); } .t-val { color: var(--t-val); } .t-at { color: var(--t-at); } .t-imp { color: var(--red); } .t-p { color: var(--faint); }

/* ---------- sheet (editor overlay) ---------- */
.sheet { position: fixed; inset: 0; z-index: 40; display: flex; justify-content: flex-end; background: rgba(8, 10, 16, 0.55); }
.sheet-card { width: min(1080px, 100%); height: 100%; display: flex; flex-direction: column; background: var(--bg); border-left: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-top { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line-soft); }
.sheet-top input { flex: 1; min-width: 0; font-size: 17px; font-weight: 600; background: transparent; border: 1px solid transparent; border-radius: var(--r-s); padding: 6px 10px; }
.sheet-top input:hover, .sheet-top input:focus { border-color: var(--line); background: var(--code-bg); outline: none; }
.sheet-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 30px; font-size: 12.5px; color: var(--faint); border-bottom: 1px solid var(--line-soft); }
.sheet-meta b { color: var(--muted); font-weight: 500; }
.sheet-body { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; padding: 16px 20px; }
.sheet-body .ed { height: 100%; }
.problems { max-height: 160px; overflow: auto; border: 1px solid var(--line-soft); border-radius: var(--r-m); background: var(--surface); }
.problems:empty { display: none; }
.prob { display: flex; gap: 10px; width: 100%; text-align: left; padding: 7px 12px; font-size: 13px; background: none; border: 0; cursor: pointer; }
.prob + .prob { border-top: 1px solid var(--line-soft); }
.prob:hover { background: var(--surface-2); }
.prob .ln { font-family: var(--mono); color: var(--faint); min-width: 54px; }
.prob.e .k { color: var(--err); } .prob.w .k { color: var(--warn); }
.sheet-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--line-soft); }
.sheet-foot .grow { flex: 1; }

/* ---------- generator ---------- */
.gen-hero { display: flex; flex-wrap: wrap; align-items: center; gap: 22px; margin-bottom: 20px; }
.gen-hero .facts { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13.5px; color: var(--muted); }
.gen-hero .facts b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.gen-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
.out-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
.out-id { font: 500 14px var(--mono); }
.out-id small { display: block; font-family: var(--sans); font-size: 12px; color: var(--faint); font-weight: 400; margin-top: 2px; }
.out-ed { padding: 12px; }
.out-ed .ed { height: min(68vh, 760px); min-height: 360px; }
.notice { padding: 22px; border-radius: var(--r-m); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 7%, var(--surface)); }
.notice h3 { margin: 0 0 6px; font-size: 16px; }
.notice p { margin: 0 0 14px; color: var(--muted); max-width: 70ch; }
.checks { list-style: none; margin: 0; padding: 4px 0; }
.checks li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 18px; font-size: 13.5px; }
.checks svg { width: 16px; height: 16px; }
.checks .yes { color: var(--ok); } .checks .no { color: var(--err); }
.checks .src { font-size: 12px; color: var(--faint); }
.checks .src.bi { color: var(--warn); }
.comps { list-style: none; margin: 0; padding: 4px 0; max-height: 420px; overflow: auto; }
.comps li { display: grid; gap: 1px; padding: 7px 18px; font-size: 13px; }
.comps li + li { border-top: 1px solid var(--line-soft); }
.comps .from { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-stack { display: grid; gap: 16px; }
details.adv summary { cursor: pointer; color: var(--muted); font-size: 13.5px; padding: 12px 18px; }
details.adv .panel-b { padding-top: 0; }
.seed-row { display: flex; gap: 8px; }
.seed-row input { flex: 1; min-width: 0; }

/* ---------- history ---------- */
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hist-item { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-m); overflow: hidden; }
.hist-sum { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 13px 18px; text-align: left; background: none; border: 0; cursor: pointer; }
.hist-sum:hover { background: var(--surface-2); }
.hist-sum .id { font: 500 14px var(--mono); }
.hist-sum .sub { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--faint); margin-top: 3px; }
.hist-sum .chev { width: 18px; height: 18px; color: var(--faint); transition: transform 0.15s; }
.hist-item.open .chev { transform: rotate(90deg); }
.hist-body { border-top: 1px solid var(--line-soft); padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; }
.hist-body .ed { height: 380px; }
.kv { display: grid; gap: 12px; font-size: 13.5px; align-content: start; }
.kv h4 { margin: 0 0 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- settings ---------- */
.set-grid { display: grid; gap: 18px; max-width: 860px; }
.set-row { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 18px; align-items: center; padding: 14px 18px; }
.set-row + .set-row { border-top: 1px solid var(--line-soft); }
.set-row h3 { margin: 0; font-size: 14.5px; font-weight: 600; }
.set-row p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.set-row .ctl { justify-self: end; display: flex; gap: 8px; align-items: center; }
.switch { position: relative; width: 40px; height: 22px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background 0.15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--text); transition: transform 0.15s; }
.switch input:checked + span { background: var(--blue); }
.switch input:checked + span::after { transform: translateX(18px); background: #0f1522; }
.switch input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }

/* ---------- dialog & toasts ---------- */
dialog { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); color: var(--text); padding: 0; width: min(460px, calc(100% - 32px)); }
dialog::backdrop { background: rgba(8, 10, 16, 0.6); }
dialog .dl-b { padding: 20px 22px 6px; }

<script>
/* HeadForge engine — pure functions, no DOM. */
const Engine = (() => {
  'use strict';

  /* ---------------- utilities ---------------- */
  function hash(str) {
    let h1 = 0x811c9dc5, h2 = 0x9e3779b9;
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      h1 ^= c; h1 = Math.imul(h1, 16777619);
      h2 = Math.imul(h2 ^ c, 2246822507); h2 ^= h2 >>> 13;
    }
    return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
  }
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const norm = s => String(s || '').replace(/\s+/g, ' ').trim();
  const lc = s => String(s || '').toLowerCase();

  function lineIndex(src) {
    const starts = [0];
    for (let i = 0; i < src.length; i++) if (src.charCodeAt(i) === 10) starts.push(i + 1);
    return idx => { let lo = 0, hi = starts.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (starts[m] <= idx) lo = m; else hi = m - 1; } return lo + 1; };
  }

  /* ---------------- HTML parser ---------------- */
  const VOID = new Set(['meta', 'link', 'base', 'br', 'img', 'hr', 'input', 'col', 'area', 'param', 'source', 'embed', 'wbr', 'track']);
  const RAW = new Set(['style', 'script', 'title', 'textarea']);

  function parseAttrs(str) {
    const attrs = [];
    const re = /([^\s=\/>"']+)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'>]+)))?/g;
    let m;
    while ((m = re.exec(str))) {
      const v = m[2] !== undefined ? m[2] : m[3] !== undefined ? m[3] : m[4];
      attrs.push([m[1], v === undefined ? null : v]);
    }
    return attrs;
  }
  function findTagEnd(src, i) {
    let q = null;
    for (; i < src.length; i++) {
      const c = src[i];
      if (q) { if (c === q) q = null; }
      else if (c === '"' || c === "'") q = c;
      else if (c === '>') return i;
    }
    return -1;
  }

  function parseHTML(src, offset = 0, lineOf = null) {
    lineOf = lineOf || lineIndex(src);
    const errors = [];
    const err = (msg, at) => errors.push({ line: lineOf(at + offset), msg });
    const root = { type: 'root', children: [] };
    const stack = [root];
    const cur = () => stack[stack.length - 1];
    let i = 0;
    const n = src.length;
    while (i < n) {
      if (src.startsWith('<!--', i)) {
        const head = src.slice(i, i + 300);
        const m = /^<!--\[if\s+([^\]]+)\]>/i.exec(head);
        if (m) {
          const after = i + m[0].length;
          if (src.startsWith('<!-->', after)) {
            const node = { type: 'cc', cond: norm(m[1]), revealed: true, children: [], at: i + offset };
            cur().children.push(node); stack.push(node); i = after + 5; continue;
          }
          const end = src.indexOf('-->', after);
          if (end < 0) { err('Conditional comment <!--[if ' + norm(m[1]) + ']> is never closed with <![endif]-->', i); break; }
          const endif = src.lastIndexOf('<![endif]', end);
          if (endif < after || src.slice(endif, end + 3).replace(/\s/g, '').toLowerCase() !== '<![endif]-->') {
            err('Conditional comment <!--[if ' + norm(m[1]) + ']> ends at "-->" before its <![endif]', i);
            cur().children.push({ type: 'comment', text: src.slice(i + 4, end) }); i = end + 3; continue;
          }
          const inner = src.slice(after, endif);
          const sub = parseHTML(inner, offset + after, lineOf);
          sub.errors.forEach(e => errors.push(e));
          cur().children.push({ type: 'cc', cond: norm(m[1]), revealed: false, children: sub.root.children, at: i + offset });
          i = end + 3; continue;
        }
        const close = /^<!--\s*<!\[endif\]\s*-->/i.exec(head);
        if (close) {
          let k = stack.length - 1;
          while (k > 0 && !(stack[k].type === 'cc' && stack[k].revealed)) k--;
          if (k <= 0) err('Found <!--<![endif]--> without a matching <!--[if ...]><!-->', i);
          else {
            for (let j = stack.length - 1; j > k; j--) err('<' + stack[j].rawName + '> is not closed before <!--<![endif]-->', stack[j].at - offset);
            stack.length = k;
          }
          i += close[0].length; continue;
        }
        const end = src.indexOf('-->', i + 4);
        if (end < 0) { err('Comment "<!--" is never closed with "-->"', i); break; }
        cur().children.push({ type: 'comment', text: src.slice(i + 4, end) });
        i = end + 3; continue;
      }
      if (/^<!\[endif\]/i.test(src.slice(i, i + 10))) {
        err('Found <![endif]--> without a matching <!--[if ...]>', i);
        const e = src.indexOf('>', i); i = e < 0 ? n : e + 1; continue;
      }
      if (src.startsWith('<!', i) || src.startsWith('<?', i)) {
        const e = src.indexOf('>', i);
        const raw = src.slice(i, e < 0 ? n : e + 1);
        cur().children.push({ type: 'doctype', raw, at: i + offset });
        i = e < 0 ? n : e + 1; continue;
      }
      if (src[i] === '<' && src[i + 1] === '/') {
        const m = /^<\/\s*([a-zA-Z][\w:.\-]*)\s*>/.exec(src.slice(i, i + 200));
        if (!m) { err('Malformed closing tag', i); i++; continue; }
        const name = lc(m[1]);
        let k = stack.length - 1;
        while (k > 0 && !(stack[k].type === 'element' && stack[k].name === name)) {
          if (stack[k].type === 'cc') { k = 0; break; }
          k--;
        }
        if (k <= 0) err('Closing tag </' + m[1] + '> has no matching opening tag', i);
        else {
          for (let j = stack.length - 1; j > k; j--) err('<' + stack[j].rawName + '> is not closed', stack[j].at - offset);
          stack.length = k;
        }
        i += m[0].length; continue;
      }
      if (src[i] === '<' && /[a-zA-Z]/.test(src[i + 1] || '')) {
        const e = findTagEnd(src, i);
        if (e < 0) { err('Tag is missing its closing ">"', i); break; }
        let inner = src.slice(i + 1, e);
        let selfClose = false;
        if (/\/\s*$/.test(inner)) { selfClose = true; inner = inner.replace(/\/\s*$/, ''); }
        const nm = /^([a-zA-Z][\w:.\-]*)/.exec(inner);
        const rawName = nm[1];
        const name = lc(rawName);
        const node = { type: 'element', name, rawName, attrs: parseAttrs(inner.slice(rawName.length)), selfClose, children: [], at: i + offset };
        cur().children.push(node);
        i = e + 1;
        if (RAW.has(name) && !selfClose) {
          const re = new RegExp('</\\s*' + name + '\\s*>', 'i');
          const rest = src.slice(i);
          const cm = re.exec(rest);
          if (!cm) { err('<' + rawName + '> is never closed', node.at - offset); node.content = rest; node.contentAt = i + offset; i = n; continue; }
          node.content = rest.slice(0, cm.index);
          node.contentAt = i + offset;
          i += cm.index + cm[0].length; continue;
        }
        if (!VOID.has(name) && !selfClose) stack.push(node);
        continue;
      }
      let e = src.indexOf('<', i + 1);
      if (e < 0) e = n;
      const text = src.slice(i, e);
      if (text.trim()) cur().children.push({ type: 'text', text, at: i + offset });
      i = e;
    }
    for (let j = stack.length - 1; j > 0; j--) {
      const s = stack[j];
      if (s.type === 'cc') err('<!--[if ' + s.cond + ']><!--> is never closed with <!--<![endif]-->', s.at - offset);
      else err('<' + s.rawName + '> is never closed', s.at - offset);
    }
    return { root, errors };
  }

  const getAttr = (node, k) => { const a = node.attrs && node.attrs.find(x => lc(x[0]) === k); return a ? (a[1] == null ? '' : a[1]) : null; };

  /* ---------------- CSS parser ---------------- */
  function parseCSS(text, baseLine = 1) {
    const errors = [];
    let i = 0;
    const n = text.length;
    let line = baseLine;
    const lineAt = idx => { let l = baseLine; for (let k = 0; k < idx && k < n; k++) if (text.charCodeAt(k) === 10) l++; return l; };
    function skipWs() {
      while (i < n) {
        if (/\s/.test(text[i])) { i++; continue; }
        if (text.startsWith('/*', i)) {
          const e = text.indexOf('*/', i + 2);
          if (e < 0) { errors.push({ line: lineAt(i), msg: 'CSS comment "/*" is never closed' }); i = n; return; }
          i = e + 2; continue;
        }
        if (text.startsWith('<!--', i)) { i += 4; continue; }
        if (text.startsWith('-->', i)) { i += 3; continue; }
        break;
      }
    }
    function readUntil(stops) {
      let s = i, q = null, depth = 0;
      while (i < n) {
        const c = text[i];
        if (q) { if (c === '\\') { i += 2; continue; } if (c === q) q = null; i++; continue; }
        if (c === '"' || c === "'") { q = c; i++; continue; }
        if (text.startsWith('/*', i)) { const e = text.indexOf('*/', i + 2); i = e < 0 ? n : e + 2; continue; }
        if (c === '(' || c === '[') depth++;
        else if (c === ')' || c === ']') depth--;
        else if (depth <= 0 && stops.includes(c)) break;
        i++;
      }
      return text.slice(s, i);
    }
    function parseDecls(body, at) {
      const decls = [];
      let k = 0, s = 0, q = null, depth = 0;
      const parts = [];
      body = body.replace(/\/\*[\s\S]*?\*\//g, '');
      for (; k <= body.length; k++) {
        const c = body[k];
        if (k === body.length || (!q && depth === 0 && c === ';')) { parts.push(body.slice(s, k)); s = k + 1; continue; }
        if (q) { if (c === q) q = null; continue; }
        if (c === '"' || c === "'") q = c;
        else if (c === '(') depth++;
        else if (c === ')') depth--;
      }
      for (const p of parts) {
        if (!p.trim()) continue;
        const ci = p.indexOf(':');
        if (ci < 0) { errors.push({ line: lineAt(at), msg: 'Invalid CSS declaration "' + norm(p).slice(0, 40) + '"' }); continue; }
        let prop = lc(p.slice(0, ci).trim());
        let value = norm(p.slice(ci + 1));
        let important = false;
        if (/!\s*important\s*$/i.test(value)) { important = true; value = value.replace(/!\s*important\s*$/i, '').trim(); }
        if (!prop) continue;
        decls.push({ prop, value, important });
      }
      return decls;
    }
    function parseBlock(nested) {
      const items = [];
      while (true) {

      for (let k = 0; k < line - 1 && k < lines.length; k++) pos += lines[k].length + 1;
      this.ta.focus();
      this.ta.setSelectionRange(pos, pos + (lines[line - 1] || '').length);
      const lh = parseFloat(getComputedStyle(this.ta).lineHeight) || 21;
      this.ta.scrollTop = Math.max(0, (line - 4) * lh);
      this.sync();
    }
  }

  function suggestName(html) {
    const t = /<title[^>]*>([\s\S]*?)<\/title>/i.exec(html);
    let base = t ? normText(t[1].replace(/<[^>]*>/g, '')).slice(0, 60) : '';
    if (!base || /^[{\[*%$#|]/.test(base)) {
      let n = Store.heads.length + 1;
      while (Store.heads.some(h => h.name === 'Email head ' + n)) n++;
      return 'Email head ' + n;
    }
    let name = base, k = 2;
    while (Store.heads.some(h => h.name === name)) name = base + ' (' + k++ + ')';
    return name;
  }
  // Returns {ok, rec?, message}
  async function addOne(rawHtml, rawName) {
    const c = E.cleanHead(rawHtml);
    if (c.empty) return { ok: false, message: 'No head was found. Paste the whole email or its <head> part; it needs at least one meta, style or link tag.' };
    if (!c.ok) return { ok: false, message: 'This head has a mistake we could not fix automatically: ' + (c.errors[0] ? 'line ' + c.errors[0].line + ', ' + c.errors[0].msg : 'unreadable code') };
    const h = contentHash(c.html);
    const dup = Store.heads.find(x => contentHash(x.html) === h);
    if (dup) return { ok: false, duplicate: true, message: 'This head is already saved as “' + dup.name + '”.' };
    const now = stamp();
    const rec = { id: newId('h_'), name: (rawName || '').trim().slice(0, 160) || suggestName(c.html), html: c.html, doctype: c.doctype || null, liked: false, createdAt: now, updatedAt: now };

    return { ok: true, rec, removed: c.removed };

    if (!res.ok) { S.notice = res; S.current = null; render(); return; }
    const d = new Date();
    const ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    let id = 'GEN-' + ymd + '-' + res.signature.slice(0, 6).toUpperCase();

        ${valid < 2 && !pickMode ? `<a class="btn big" href="#add">${ICON.plus}Add heads</a>` : ''}
        <div class="mix" role="radiogroup" aria-label="Mix intensity"><span class="lbl">Mix intensity</span>
          <div class="mix-opts">${[['normal', 'Normal', 'Keeps each part the way your heads wrote it'], ['strong', 'Strong', 'Mixes every style value, like Head Mixer']].map(([k, l, d]) => `<button role="radio" aria-checked="${(Store.settings.mixMode || 'normal') === k}" data-act="mix" data-mode="${k}"><b>${l}</b><small>${d}</small></button>`).join('')}</div>
        </div>
      </div>
      ${Store.heads.length + liked().length >= 2 ? `<div class="panel picker">
        <div class="pick-top"><span class="lbl">Heads to mix</span>
          <div class="mix-opts" role="radiogroup" aria-label="Heads to mix">${[['all', 'All my heads', 'Every head you added'], ['pick', 'Choose heads', 'Only the ones you tick, including liked generated heads']].map(([k, l, d]) => `<button role="radio" aria-checked="${(Store.settings.mixSource || 'all') === k}" data-act="src" data-src="${k}"><b>${l}</b><small>${d}</small></button>`).join('')}</div>
          <span class="pill blue" id="pick-count"></span>
        </div>
        ${pickMode ? `<div class="pick-body">
          <div class="pick-tools"><div class="search">${ICON.search}<input class="input" id="pick-q" type="search" placeholder="Search heads" aria-label="Search heads" value="${esc(pickQ)}"></div>
            <button class="btn" data-act="pick-all">Select all shown</button><button class="btn ghost" data-act="pick-none">Clear selection</button></div>
          <p class="add-msg err" id="pick-warn" hidden>Select at least 2 heads to mix.</p>
          <div class="pick-list" id="pick-list"></div>
        </div>` : ''}
      </div>` : ''}
      ${S.notice ? `<div class="notice" role="status"><h3>No new head this time</h3><p>${esc(S.notice.message)}</p><a class="btn" href="#add">${ICON.plus}Add more heads</a></div>` : ''}
      ${rec ? `<div class="panel result">
          <div class="out-bar">
            <div class="btns"><span class="pill ${rec.mixMode === 'strong' ? 'warn' : 'blue'}">${rec.mixMode === 'strong' ? 'Strong mix' : 'Normal mix'}</span><span class="pill ${nOk === E.FEATURES.length ? 'ok' : 'err'}">${nOk === E.FEATURES.length ? 'All ' + nOk + ' email features included' : nOk + ' of ' + E.FEATURES.length + ' email features'}</span></div>
            <div class="btns">
              <button class="btn big" data-act="copy-cur">${ICON.copy}Copy</button>
              <button class="btn big" data-act="dl-cur">${ICON.down}Download</button>
              <button class="btn big heart-btn${rec.liked ? ' on' : ''}" data-act="like-cur" aria-pressed="${rec.liked}">${rec.liked ? ICON.heartOn + 'Liked' : ICON.heart + 'Like'}</button>
            </div>
          </div>
          <div class="out-ed" id="gen-ed"></div>
          <details class="inside"><summary>What’s inside this head</summary>
            <div class="inside-b"><div><h4>Email features</h4><ul class="checks">${featureList(rec)}</ul></div>
            <div><h4>Built from</h4><div class="chips">${rec.sourceNames.map(n => `<span class="pill">${esc(n)}</span>`).join('') || '<span class="muted">Built-in defaults</span>'}</div>
            <p class="hint">${rec.mixMode === 'strong' ? 'Styles were mixed value by value from your heads. Meta tags and Outlook blocks use the Head Mixer’s fixed set.' : rec.builtins.filter(b => !/^meta:/.test(b)).length ? 'Parts none of your heads had were added from safe built-in defaults.' : 'Everything came from your own heads.'}</p></div></div>
          </details>
        </div>` : (!S.notice && valid >= 2 ? `<div class="panel empty"><h3>Press “Generate head”</h3><p>Your new head will appear here. Like the ones you want to keep and they’ll be saved in Favorites.</p></div>` : '')}
      ${valid < 2 && !rec ? `<div class="panel empty"><h3>You have ${valid} head${valid === 1 ? '' : 's'}</h3><p>The generator needs at least two to mix. You can also try it with examples.</p><button class="btn" data-act="examples">Add 3 example heads</button></div>` : ''}`;
    if (rec) new CodeEditor($('#gen-ed'), { readOnly: true, value: rec.html, label: 'Generated head' });
    if (pickMode) {
      renderPickList();
      let t;
      $('#pick-q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { pickQ = e.target.value; renderPickList(); }, 120); });
    }
    updatePickState();
  }

  /* ================= favorites ================= */
  function favItems() {
    const gens = liked().map(g => ({ kind: 'gen', id: g.id, name: genName(g), date: g.createdAt, html: g.html, rec: g }));
    const heads = Store.heads.filter(h => h.liked).map(h => ({ kind: 'head', id: h.id, name: h.name, date: h.updatedAt, html: h.html, rec: h }));
    let list = S.fav.tab === 'gen' ? gens : S.fav.tab === 'head' ? heads : gens.concat(heads);
    const q = S.fav.q.trim().toLowerCase();
    if (q) list = list.filter(x => x.name.toLowerCase().includes(q) || x.id.toLowerCase().includes(q));
    return list.sort((a, b) => b.date - a.date);
  }
  function renderFavorites() {
    const el = $('#v-favorites');
    if (!el.dataset.built) {
      el.dataset.built = '1';
      el.innerHTML = `<div class="view-head"><div><h1>Favorites</h1><p>Heads you liked, both generated ones and ones you added.</p></div></div>
        <div class="toolbar"><div class="tabs" role="tablist" id="fav-tabs"></div><div class="search">${ICON.search}<input class="input" id="fav-q" type="search" placeholder="Search favorites" aria-label="Search favorites"></div></div>
        <div id="fav-list"></div>`;
      let t;
      $('#fav-q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { S.fav.q = e.target.value; renderFavList(); }, 140); });
    }
    renderFavList();
  }
  function renderFavList() {
    const gN = liked().length, hN = Store.heads.filter(h => h.liked).length;
    $('#fav-tabs').innerHTML = [['all', 'All', gN + hN], ['gen', 'Generated', gN], ['head', 'My heads', hN]].map(([k, l, n]) => `<button class="tab" role="tab" aria-selected="${S.fav.tab === k}" data-act="fav-tab" data-tab="${k}">${l} <span>${n}</span></button>`).join('');
    const list = favItems();
    const host = $('#fav-list');
    if (!gN && !hN) { host.innerHTML = `<div class="panel empty"><h3>No favorites yet</h3><p>Press the heart on a generated head, or on one of your own heads, to keep it here.</p><a class="btn primary" href="#generate">${ICON.gen}Generate a head</a></div>`; return; }
    if (!list.length) { host.innerHTML = '<div class="panel empty"><h3>Nothing here</h3><p>Try another tab or search.</p></div>'; return; }
    host.innerHTML = '<ul class="hist">' + list.map(x => {
      const open = S.fav.open === x.id;
      return `<li class="hist-item${open ? ' open' : ''}">
        <div class="fav-row">
          <button class="hist-sum" data-act="fav-open" data-id="${esc(x.id)}" aria-expanded="${open}"><div><div class="fav-name">${esc(x.name)}</div><div class="sub"><span class="pill ${x.kind === 'gen' ? 'blue' : ''}">${x.kind === 'gen' ? 'Generated' : 'My head'}</span><span>${esc(rel(x.date))}</span></div></div>${ICON.chev}</button>
          <div class="row-actions">
            <button class="btn icon ghost" data-act="fav-copy" data-id="${esc(x.id)}" aria-label="Copy" title="Copy">${ICON.copy}</button>
            <button class="btn icon ghost" data-act="fav-dl" data-id="${esc(x.id)}" aria-label="Download" title="Download">${ICON.down}</button>
            <button class="btn icon ghost heart on" data-act="fav-unlike" data-id="${esc(x.id)}" aria-label="Remove from favorites" title="Remove from favorites">${ICON.heartOn}</button>
          </div>
        </div>
        ${open ? `<div class="fav-body"><div id="fed-${esc(x.id)}"></div></div>` : ''}
      </li>`;
    }).join('') + '</ul>';
    const o = list.find(x => x.id === S.fav.open);
    if (o) new CodeEditor(document.getElementById('fed-' + o.id), { readOnly: true, value: o.html, label: o.name });
  }
  function favById(id) { return favItems().find(x => x.id === id) || null; }
  const headDoc = h => (h.doctype || DEFAULT_DOCTYPE) + '\n' + (/^\s*<head\b/i.test(h.html) ? h.html : '<head>\n' + h.html + '\n</head>');

  /* ================= settings ================= */
  function renderSettings() {
    const el = $('#v-preferences');
    const st = Store.settings;
    const remembered = Store.gens.length;
    const modeText = { cloud: 'Saved to your Claude account. Only you can see it.', local: 'Saved in this browser only. Use Backup to move it to another computer.', memory: 'Not saved. Everything is lost when you close the page. Download a backup.' }[Store.mode];
    el.innerHTML = `<div class="view-head"><div><h1>Settings</h1></div></div>
      <div class="set-grid">
        ${Store.note ? `<div class="notice"><p style="margin:0">${esc(Store.note)}</p></div>` : ''}
        <div class="panel">
          <div class="set-row"><div><h3>Where your work is saved</h3><p>${esc(modeText)}</p></div><div class="ctl"><span class="pill ${Store.mode === 'cloud' ? 'ok' : Store.mode === 'local' ? 'warn' : 'err'}">${Store.mode === 'cloud' ? 'Your account' : Store.mode === 'local' ? 'This browser' : 'Not saved'}</span></div></div>
          <div class="set-row"><div><h3>Backup</h3><p>Download all your heads and favorites as one file, or load a backup file. Loading never replaces what you already have.</p></div><div class="ctl"><button class="btn" data-act="export">${ICON.down}Download backup</button><label class="btn">${ICON.up}Load backup<input type="file" id="imp-json" accept=".json,application/json" class="sr"></label></div></div>
        </div>
        <div class="panel">
          <div class="set-row"><div><h3>How different each new head should be</h3><p>Higher means each generated head changes more parts compared with earlier ones.</p></div><div class="ctl"><select class="select" id="s-mindiff" aria-label="How different">${[[1, 'A little'], [2, 'Normal'], [4, 'Quite different'], [8, 'Very different']].map(([v, l]) => `<option value="${v}" ${st.minDiff === v ? 'selected' : ''}>${l}</option>`).join('')}${[1, 2, 4, 8].includes(st.minDiff) ? '' : `<option value="${st.minDiff}" selected>Custom (${st.minDiff})</option>`}</select></div></div>
          <div class="set-row"><div><h3>Include a page title</h3><p>Use a title from one of your heads.</p></div><div class="ctl"><label class="switch"><input type="checkbox" id="s-title" ${st.includeTitle ? 'checked' : ''} aria-label="Include a page title"><span></span></label></div></div>
          <div class="set-row"><div><h3>Start uniqueness over</h3><p>The app remembers ${plural(remembered, 'past generation')} so it never repeats one. Forget them if it says it has run out of new combinations. Favorites stay.</p></div><div class="ctl"><button class="btn" data-act="forget" ${Store.gens.some(g => !g.liked) ? '' : 'disabled'}>Forget past generations</button></div></div>
        </div>
        <div class="panel">
          <div class="set-row"><div><h3>Theme</h3></div><div class="ctl"><select class="select" id="s-theme" aria-label="Theme"><option value="dark" ${st.theme !== 'light' ? 'selected' : ''}>Dark</option><option value="light" ${st.theme === 'light' ? 'selected' : ''}>Light</option></select></div></div>
          <div class="set-row"><div><h3>Example heads</h3><p>Adds three sample heads to try the generator.</p></div><div class="ctl"><button class="btn" data-act="examples">Add examples</button></div></div>
          <div class="set-row"><div><h3>Delete all heads</h3><p>Removes every head you added. Generated favorites stay.</p></div><div class="ctl"><button class="btn danger" data-act="clear-heads" ${Store.heads.length ? '' : 'disabled'}>Delete all heads</button></div></div>
        </div>
      </div>`;
    const upd = async (k, v) => { Store.settings[k] = v; try { await Store.saveSettings(); toast('Saved', 'ok'); } catch (e) { toast('Could not save: ' + errText(e), 'err'); } };
    $('#s-mindiff').addEventListener('change', e => upd('minDiff', parseInt(e.target.value, 10)));
    $('#s-title').addEventListener('change', e => upd('includeTitle', e.target.checked));
    $('#s-theme').addEventListener('change', e => { applyTheme(e.target.value); upd('theme', e.target.value); });
    $('#imp-json').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); });
  }
  function applyTheme(t) { if (t === 'light') document.documentElement.setAttribute('data-ui', 'light'); else document.documentElement.removeAttribute('data-ui'); }
  async function exportBackup() {
    const data = JSON.stringify({ app: 'envelope-head-library', version: 2, exportedAt: new Date().toISOString(), heads: Store.heads, generations: liked().map(packGen) }, null, 2);
    await saveFile('head-library-backup-' + new Date().toISOString().slice(0, 10) + '.json', data);
  }
  async function importBackup(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { toast('That file is not a backup file.', 'err'); return; }
    const heads = Array.isArray(data.heads) ? data.heads : [];
    const gens = Array.isArray(data.generations) ? data.generations : [];
    if (!heads.length && !gens.length) { toast('No heads or favorites found in that file.', 'err'); return; }
    let h = 0, g = 0, skipped = 0;
    for (const x of heads) {
      if (!x || typeof x.html !== 'string') continue;
      try {
        const r = await addOne((x.doctype || '') + x.html, x.name);
        if (r.ok) { h++; if (x.liked) { r.rec.liked = true; await Store.put('heads', r.rec); } } else skipped++;
      } catch (e) { toast('Stopped: ' + errText(e), 'err'); break; }
    }
    for (const r of gens) {
      if (!r || typeof r.html !== 'string' || /<script|<body/i.test(r.html)) continue;
      if (r.liked === false) continue;
      let id = String(r.id || 'GEN-IMPORTED').replace(/[^\w\-]/g, '').slice(0, 54);
      const base = id;
      for (let k = 2; Store.gens.some(x => x.id === id); k++) id = base + '-' + k;
      const now = stamp();
      const rec = { components: [], builtins: [], sources: [], sourceNames: [], features: E.detectFeatures(r.html), seed: 0, ...unpackGen(r), id, liked: true, updatedAt: now, createdAt: r.createdAt || now };
      try { await Store.put('gens', rec); Store.gens.push(rec); g++; } catch (e) { toast('Stopped: ' + errText(e), 'err'); break; }
    }
    toast('Loaded ' + plural(h, 'head') + ' and ' + plural(g, 'favorite') + (skipped ? ', skipped ' + skipped + ' already saved' : ''), 'ok');
    render();
  }
  async function forgetGens() {
    const list = Store.gens.filter(g => !g.liked);
    if (!(await confirmDialog({ title: 'Forget ' + plural(list.length, 'past generation') + '?', body: 'New heads may then repeat earlier combinations. Your favorites are kept.', ok: 'Forget', danger: true }))) return;
    let n = 0;
    for (const g of list) { try { await Store.del('gens', g.id); Store.gens = Store.gens.filter(x => x.id !== g.id); n++; } catch (e) { toast('Stopped after ' + n + ': ' + errText(e), 'err'); break; } }
    toast('Forgot ' + plural(n, 'generation'), 'ok'); render();
  }
  async function clearHeads() {
    if (!(await confirmDialog({ title: 'Delete all ' + plural(Store.heads.length, 'head') + '?', body: 'Every head you added will be removed, including liked ones. This can’t be undone.', ok: 'Delete all', danger: true }))) return;
    let n = 0;
    for (const h of Store.heads.slice()) { try { await Store.del('heads', h.id); Store.heads = Store.heads.filter(x => x.id !== h.id); n++; } catch (e) { toast('Stopped after ' + n + ': ' + errText(e), 'err'); break; } }
    toast('Deleted ' + plural(n, 'head'), 'ok'); render();
  }
  async function addExamples() {
    let n = 0;
    for (const x of EXAMPLES) { try { const r = await addOne(x.html, x.name); if (r.ok) n++; } catch (e) { toast('Could not add: ' + errText(e), 'err'); break; } }
    toast(n ? 'Added ' + plural(n, 'example head') : 'The examples are already added', 'ok'); render();
  }

  /* ================= events ================= */
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const act = b.dataset.act, id = b.dataset.id;
    switch (act) {
      case 'add': addFromBox(); break;
      case 'open-head': openSheet(id); break;
      case 'del-head': deleteHead(id); break;
      case 'like-head': toggleHeadLike(id); break;
      case 'copy-head': { const h = Store.heads.find(x => x.id === id); if (h) toast((await copyText(h.html)) ? 'Copied' : 'Copy failed. Select the code and copy it.', 'ok'); break; }
      case 'sheet-close': closeSheet(false); break;
      case 'sheet-save': saveSheet(); break;
      case 'mine-page': S.mine.page += parseInt(b.dataset.d, 10); renderMine(); break;
      case 'generate': runGenerate(); break;
      case 'src': {
        const m = b.dataset.src;
        if (Store.settings.mixSource === m) break;
        Store.settings.mixSource = m;
        if (m === 'pick' && !(Store.settings.picked || []).length) Store.settings.picked = Store.heads.filter(h => h.liked).map(h => h.id).concat(liked().map(g => g.id));
        savePicks();
        renderGenerate();
        break;
      }
      case 'pick-all': { const set = picked(); const { gens, heads } = pickCandidates(); gens.concat(heads).forEach(x => set.add(x.id)); setPicked(set); renderPickList(); break; }
      case 'pick-none': setPicked(new Set()); renderPickList(); break;
      case 'mix': {
        const m = b.dataset.mode;
        if (Store.settings.mixMode === m) break;
        Store.settings.mixMode = m;
        $$('[data-act="mix"]').forEach(x => x.setAttribute('aria-checked', String(x.dataset.mode === m)));
        Store.saveSettings().catch(err => toast('Could not save your choice: ' + errText(err), 'err'));
        break;
      }
      case 'copy-cur': if (S.current) toast((await copyText(S.current.html)) ? 'Copied' : 'Copy failed. Select the code and copy it.', 'ok'); break;
      case 'dl-cur': if (S.current) saveFile(S.current.id + '.html', S.current.html); break;
      case 'like-cur': if (S.current) setGenLike(S.current, !S.current.liked); break;
      case 'fav-tab': S.fav.tab = b.dataset.tab; renderFavList(); break;
      case 'fav-open': S.fav.open = S.fav.open === id ? null : id; renderFavList(); break;
      case 'fav-copy': { const x = favById(id); if (x) toast((await copyText(x.kind === 'gen' ? x.html : headDoc(x.rec))) ? 'Copied' : 'Copy failed. Select the code and copy it.', 'ok'); break; }
      case 'fav-dl': { const x = favById(id); if (x) saveFile((x.kind === 'gen' ? x.id : x.name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') || 'head') + '.html', x.kind === 'gen' ? x.html : headDoc(x.rec)); break; }
      case 'fav-unlike': { const x = favById(id); if (!x) break; if (x.kind === 'gen') setGenLike(x.rec, false); else toggleHeadLike(x.id); break; }
      case 'examples': addExamples(); break;
      case 'export': exportBackup(); break;
      case 'forget': forgetGens(); break;
      case 'clear-heads': clearHeads(); break;
    }
  });
  document.addEventListener('change', e => {
    const id = e.target && e.target.dataset && e.target.dataset.pick;
    if (!id) return;
    const set = picked();
    if (e.target.checked) set.add(id); else set.delete(id);
    setPicked(set);
  });
  document.addEventListener('keydown', e => {
    if (sheetEd) {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveSheet(); }
      if (e.key === 'Escape' && !$('#dlg').open && (document.activeElement !== sheetEd.ta || sheetEd.escCount >= 2)) closeSheet(false);
    } else if (S.view === 'add' && addEd && document.activeElement === addEd.ta && (e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); addFromBox(); }
  });
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(false); });
  window.addEventListener('hashchange', route);

  const EXAMPLES = window.__EXAMPLES__ || [];

  /* ================= boot ================= */
  (async () => {
    await Store.init();
    applyTheme(Store.settings.theme);
    $('#store-foot').innerHTML = '<span class="dot ' + Store.mode + '"></span>' + ({ cloud: 'Saved to your account', local: 'Saved in this browser', memory: 'Not saved, download a backup' })[Store.mode];
    if (Store.note) toast(Store.note, 'err');
    lastStamp = Math.max(0, ...Store.heads.map(h => h.updatedAt || 0), ...Store.gens.map(g => g.updatedAt || 0));
    $('#boot').hidden = true;
    route();
  })();
})();

</script>
</body>
</html>
{% endraw %}
